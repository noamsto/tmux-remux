name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release-please PRs are opened with GITHUB_TOKEN, so their pull_request runs
  # stall at action_required; release.yml dispatches CI on the PR branch instead.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Run against the flake's tmux (3.6a) — the version lazytmux ships and
      # the project targets. apt's tmux 3.4 rewrites control bytes (the \x1f
      # field separator) to "_" in -F output when run outside a client.
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: cachix/cachix-action@v17
        with:
          name: lazytmux
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix develop --command go test -tags=integration -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  # -test=false: nilaway can't see that require.NoError/t.Fatal end a test, so
  # test files report false positives on every checked-then-used result.
  nilaway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: cachix/cachix-action@v17
        with:
          name: lazytmux
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix develop --command nilaway -test=false -include-pkgs=github.com/noamsto/tmux-remux ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: cachix/cachix-action@v17
        with:
          name: lazytmux
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix build .
