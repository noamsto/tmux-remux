name: release

on:
  push:
    branches: [main]
  # Dispatched by release-automerge.yml after it merges the release PR: a
  # GITHUB_TOKEN push does not trigger workflows, but workflow_dispatch is the
  # documented exception, so this is what actually cuts the release.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
      # PRs opened by GITHUB_TOKEN only get pull_request runs that sit at
      # action_required, so the required test/lint/build checks never report and
      # the release PR can't merge. workflow_dispatch is the exception: dispatch
      # CI on the release PR branch so its check runs land on the PR head.
      - name: Run CI on the release PR branch
        if: ${{ steps.rp.outputs.prs_created == 'true' }}
        # Must not fail the job: goreleaser needs it, and a release can be cut in
        # the same run that updates the next release PR.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.rp.outputs.pr }}
        run: |
          branch=$(jq -r '.headBranchName' <<<"$PR")
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"

  # Gated on the same workflow run rather than the tag-push event: a tag created
  # by GITHUB_TOKEN does not trigger downstream workflows, so chaining via job
  # dependency is what builds the archives without needing a PAT.
  goreleaser:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
