# tmux-remux wiring — generated by `tmux-remux triggers`; do not edit by hand.
# Targets tmux < 3.8.

# Save snapshots on structural change
# after-split-window stands in for the pane-created hook tmux doesn't have: without it
# a new pane reaches no snapshot until the next window/session event, and undo can
# only restore what a snapshot recorded.
set-hook -g session-created     'run-shell -b "tmux-remux save --reason=hook:session-created"'
set-hook -g window-linked       'run-shell -b "tmux-remux save --reason=hook:window-linked"'
set-hook -g after-split-window  'run-shell -b "tmux-remux save --reason=hook:after-split-window"'
set-hook -g client-detached     'run-shell -b "tmux-remux save --reason=hook:client-detached"'

# Capture close events for undo
# Hook pane-exited (pane-died only fires with remain-on-exit); kind stays "pane-died" for the diff
# --session-name is quoted so a session name containing spaces stays one shell
# word; the '\'' splices in a literal quote without ending this line's own
# single-quoted argument (tmux's config quoting has no backslash escape).
# --session needs the same treatment: #{hook_session} expands to a $-prefixed
# id like $38, which an unquoted sh -c reads as the positional parameter $3
# followed by a literal 8 — collapsing distinct session ids and confusing the
# cascade-close dedup in closeevent.Capture.
set-hook -g pane-exited        'run-shell -b "tmux-remux capture-event pane-died          --pane=#{hook_pane}    --window=#{hook_window} --session='\''#{hook_session}'\'' --session-name='\''#{hook_session_name}'\''"'
# prefix+x kills the pane without its program exiting, so pane-exited never fires.
# after-kill-pane is a command hook with no hook_pane; the id is recovered by diffing
# the survivors against the last snapshot.
set-hook -g after-kill-pane    'run-shell -b "tmux-remux capture-event pane-died"'
set-hook -g window-unlinked    'run-shell -b "tmux-remux capture-event window-unlinked    --window=#{hook_window} --session='\''#{hook_session}'\'' --session-name='\''#{hook_session_name}'\''"'
set-hook -g session-closed     'run-shell -b "tmux-remux capture-event session-closed     --session='\''#{hook_session}'\'' --session-name='\''#{hook_session_name}'\''"'

# Auto-restore on tmux start
run-shell -b 'tmux-remux restore --auto'

# Keybindings
bind   u    run-shell "tmux-remux undo --pop --session='#{session_name}'"
bind   U    display-popup -E -w 90% -h 85% "tmux-remux pick --kind=close --session='#{session_name}'"
bind   R    display-popup -E -w 90% -h 85% 'tmux-remux pick --kind=snapshot'
bind C-s    run-shell 'tmux-remux save --reason=keybinding'
